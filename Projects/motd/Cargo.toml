[package]
name = "motd"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["3d", "ui", "jpeg"] }

# Keep our crate debuggable, but build heavy deps (bevy) optimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
