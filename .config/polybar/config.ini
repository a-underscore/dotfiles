; ============================================================================
;  polybar - "industrial" profile for i3 on Gentoo (X11, NVIDIA, glx picom)
;
;  This is the desktop's bar; i3bar is switched off in ~/.config/i3/config.
;  The palette, the 4px accent and the font are the same values the i3 config,
;  rofi and dunst use, so the bar reads as part of one UI:
;      background #121212   foreground #ffffff   primary #ffffff
;      unfocused  #333333   inactive   #666666   urgent  #ff0000
;  polybar cannot read those out of the i3 config, so keep the six hex values
;  below in sync with it by hand.
;
;  Syntax notes that bite:
;    - inline comments do NOT exist (name = value ; comment sets value to
;      "value ; comment"), so every comment lives on its own line
;    - a literal percent sign inside a label is written %%
;    - ${colors.x} works as a value, but NOT inside a %{F...} format tag
;
;  Handy commands
;    parse check + print one value:  polybar -c ~/.config/polybar/config.ini -d background
;    snapshot the bar to a png:      polybar -c ~/.config/polybar/config.ini -p /tmp/bar.png main
;    reload after an edit:           nothing to do - polybar-start passes
;                                    --reload, so saving this file re-reads it
;                                    (polybar-msg would also work, but the ipc
;                                    flag builds it and it is not installed
;                                    here - see enable-ipc below)
;    log:                            $XDG_RUNTIME_DIR/polybar.log, written by
;                                    ~/.local/bin/polybar-start (polybar itself
;                                    has no --log-file flag)
;
;  Started by i3 through ~/.local/bin/polybar-start (flock-guarded like
;  picom-start, so a reload never produces a second bar).
; ============================================================================

[colors]
background = #121212
foreground = #ffffff
primary = #ffffff
unfocused = #333333
inactive = #666666
urgent = #ff0000

[bar/main]
; The i3bar this replaces is full width, 26px tall and at the BOTTOM of the
; screen (i3bar's default position), so this mirrors it: no offsets, no
; rounding, no border.  A border would be added on top of `height`, and the
; outer corners are already rounded by picom (corner-radius = 8, the i3bar
; rounded the same way), so radius stays 0 here.
monitor = ${env:MONITOR:}
bottom = true
width = 100%
height = 26
offset-x = 0
offset-y = 0
radius = 0
border-size = 0
background = ${colors.background}
foreground = ${colors.foreground}
; The i3 theme's 4px accent ($thickness).  Only modules that draw an
; underline/overline use it - the workspace chips below colour themselves with
; their label background instead, the way i3bar's buttons did.
line-size = 4
line-color = ${colors.primary}
; i3's $uifont is pango:RobotoMono 12 and polybar sizes in points too, so 12
; matches the i3bar text size.  Append ;<px> to the pattern if the text ever
; sits high or low in the 26px rail.
font-0 = "RobotoMono:size=12"
; The half-discs that round the workspace chips (◖ = U+25D6, ◗ = U+25D7).
; RobotoMono has no such glyph, and the font this bar was originally written
; for (Noto Sans Symbols 2) is NOT installed on this box: fontconfig silently
; matched that pattern to Liberation Sans, so the caps have ALWAYS been drawn
; by Liberation Sans here.  Name it explicitly so the result cannot drift, and
; note that its metrics differ from the ones the old comment assumed - it draws
; the discs 0.28em wide, on a 0.51em advance, with ~0.25em side bearings, and
; its glyph box is ~1.16em tall.  Measured on this box (bar height 26):
;   pixelsize=52 -> disc ink 26px tall, i.e. the full rail height (at the old
;                   32 the caps were only 17px, which is why the chip bodies
;                   looked oversized between two small nubs).  pixelsize
;                   (unlike size) is not DPI-scaled, so a higher dpi cannot
;                   silently shrink the caps.
;   ;7           -> vertical offset in px that centres the disc on the rail:
;                   every column of the cap then has top+bot = 25, i.e. it is
;                   symmetric about the rail's middle.  Raise it and the caps
;                   drop, lower it and they rise, 1px per unit.
; The three offsets that consume the side bearings live in the labels below.
font-1 = "Liberation Sans:pixelsize=52;7"
; Chips start flush at x=0 like i3bar's, so no left padding/margin; the
; right-hand readouts get a 6px gap each and the bar ends 6px before the edge.
padding-left = 0
padding-right = 6
module-margin-left = 0
module-margin-right = 6
; Workspaces on the left, readouts on the right, tray in the far corner.
modules-left = i3
modules-right = cpu memory network volume date tray
; polybar-msg (reload/restart/toggle) needs this; it defaults to false.
enable-ipc = true
; polybar defines _NET_WM_STRUT / _NET_WM_STRUT_PARTIAL so i3 reserves the
; bar's height.  That is the 3.7 default, stated here because the whole layout
; depends on it.
enable-struts = true
; Left as a normal managed dock window (defaults).  To keep the bar above
; fullscreen windows instead, i3 needs this pair - not used, because fullscreen
; should keep the screen to itself exactly as it did with i3bar:
;   override-redirect = true
;   wm-restack = i3
fixed-center = true
cursor-click = pointer
cursor-scroll = ns-resize

[settings]
; ~/.screenlayout/run.sh sets the geometry before this bar starts (i3 runs the
; Display section first); reload the bar if the layout changes later.
screenchange-reload = true

; ----------------------------------------------------------------------------
;  Workspaces - square indicators
;
;  Keep the workspace indicators as rectangular blocks so they sit flush and
;  read as a single tight set rather than rounded pills.
; ----------------------------------------------------------------------------
[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
enable-click = true
; No "|" between workspaces, i3bar draws none.
label-separator = ""
label-focused = %{F#000000}%{B#f5f5f5}%index%
label-focused-background = ${colors.primary}
label-focused-foreground = #000000
label-focused-padding = 0
label-visible = %{F#ffffff}%{B#666666}%index%
label-visible-background = ${colors.inactive}
label-visible-foreground = ${colors.foreground}
label-visible-padding = 0
label-unfocused = %{F#ffffff}%{B#333333}%index%
label-unfocused-background = ${colors.unfocused}
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 0
label-urgent = %{F#ffffff}%{B#ff0000}%index%
label-urgent-background = ${colors.urgent}
label-urgent-foreground = ${colors.foreground}
label-urgent-padding = 0
; The i3 mode (resize, ...) as its own square white block, matching the
; focused workspace style.
label-mode = %{F#000000}%{B#f5f5f5}%mode%
label-mode-background = ${colors.primary}
label-mode-foreground = #000000
label-mode-padding = 0

; ----------------------------------------------------------------------------
;  Readouts
;
;  Flat on the bar background: a short label in $inactive (#666666, the colour
;  i3 uses for client.focused_inactive) followed by the value in $foreground.
;  Nothing below sets a background, so the only coloured blocks on the bar are
;  the focused workspace and the i3 mode block.
; ----------------------------------------------------------------------------
[module/cpu]
type = internal/cpu
interval = 2
; Above 90% the value goes to $urgent (#ff0000, i3's client.urgent colour).
warn-percentage = 90
format = <label>
format-prefix = "CPU "
format-prefix-foreground = ${colors.inactive}
label = %percentage%%
format-warn = <label-warn>
format-warn-prefix = "CPU "
format-warn-prefix-foreground = ${colors.inactive}
label-warn = %percentage%%
label-warn-foreground = ${colors.urgent}

[module/memory]
type = internal/memory
interval = 3
warn-percentage = 92
format = <label>
format-prefix = "MEM "
format-prefix-foreground = ${colors.inactive}
label = %percentage_used%%
format-warn = <label-warn>
format-warn-prefix = "MEM "
format-warn-prefix-foreground = ${colors.inactive}
label-warn = %percentage_used%%
label-warn-foreground = ${colors.urgent}

[module/network]
type = internal/network
; Set by ~/.local/bin/polybar-start from the default route, so the module
; follows whatever link is really up (wired enp3s0 or the USB wifi
; wlp1s0f0u10) instead of a hardcoded name; falls back to the wired port when
; there is no default route at all.
interface = ${env:POLYBAR_NET_IF:enp3s0}
interval = 3
format-connected = <label-connected>
format-connected-prefix = "NET "
format-connected-prefix-foreground = ${colors.inactive}
label-connected = %ifname%
format-disconnected = <label-disconnected>
format-disconnected-prefix = "NET "
format-disconnected-prefix-foreground = ${colors.inactive}
label-disconnected = down
label-disconnected-foreground = ${colors.inactive}

[module/volume]
type = internal/pulseaudio
; pipewire-pulse serves the PulseAudio protocol on this box, so this follows the
; default sink; scroll up/down on it changes the volume, left click mutes
; (wpctl is the pipewire counterpart of pactl and is installed here).
format-volume = <label-volume>
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.inactive}
label-volume = %percentage%%
format-muted = <label-muted>
format-muted-prefix = "VOL "
format-muted-prefix-foreground = ${colors.inactive}
label-muted = muted
label-muted-foreground = ${colors.urgent}
click-left = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

[module/date]
type = internal/date
interval = 1
; Same content as the i3 status script this replaces
; (~/.config/i3/status.sh used `date +'%-d/%-m/%Y %H:%M:%S'`).  polybar cannot
; do the non-padded %-d/%-m, so day and month are zero-padded here, and the
; colours stay white like i3bar's `statusline $font_color`.
date = %d/%m/%Y
time = %H:%M:%S
label = %date%  %time%

[module/tray]
type = internal/tray
; Drop the word `tray` from modules-right above to disable it.  Only one tray
; can exist per session; polybar warns if a second one shows up.
format-margin = 4px
tray-spacing = 3px
tray-padding = 3px
