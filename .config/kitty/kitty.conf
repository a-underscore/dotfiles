# ~/.config/kitty/kitty.conf
#
# kitty as a drop-in replacement for Alacritty.
#
# Every value below mirrors what Alacritty actually ran with: the overrides
# from ~/.config/alacritty/alacritty.toml plus Alacritty's built-in defaults.
# The effective Alacritty config was verified with `alacritty msg get-config`.

# ----- Font -----------------------------------------------------------------
# alacritty: font.normal = { family = "RobotoMono", style = "Regular" }
#            font.size = 11.25
# Bold/italic/bold-italic are resolved automatically; the Roboto Mono
# Bold/Italic faces are installed (verified with fc-match).
font_family RobotoMono
font_size 11.25

# ----- Colors ---------------------------------------------------------------
# alacritty.toml: [colors.primary] (background / foreground / bright_foreground)
foreground #ffffff
background #121212

# Alacritty's built-in default ANSI palette (it only overrides the primary
# colors, so everything else comes from these compiled-in defaults).
color0  #181818
color8  #6b6b6b
color1  #ac4242
color9  #c55555
color2  #90a959
color10 #aac474
color3  #f4bf75
color11 #feca88
color4  #6a9fb5
color12 #82b8c8
color5  #aa759f
color13 #c28cb8
color6  #75b5aa
color14 #93d3c3
color7  #d8d8d8
color15 #f8f8f8

# ----- Cursor ---------------------------------------------------------------
# alacritty: cursor.style = Block, blink_interval = 750 ms, blink_timeout = 5 s
# "none" draws the cursor as reverse video of the cell under it, which is
# exactly Alacritty's cursor CellForeground/CellBackground behavior.
cursor none
cursor_shape block
cursor_blink_interval 0.75
cursor_stop_blinking_after 5

# ----- Selection ------------------------------------------------------------
# Alacritty's default selection is reverse video of the cell. Setting both to
# "none" gives kitty the same reverse-video behavior.
selection_foreground none
selection_background none

# ----- Behaviour parity with Alacritty's built-in defaults ------------------
# scrollback_lines: alacritty scrolling.history = 10000
# mouse_hide_wait: alacritty never hides the mouse pointer
# enable_audio_bell: alacritty has no audio bell
# confirm_os_window_close: alacritty closes windows without confirmation
scrollback_lines 10000
mouse_hide_wait 0
enable_audio_bell no
confirm_os_window_close 0

# ----- Shell integration ----------------------------------------------------
# Alacritty does not touch the shell prompt, the cursor shape or the window
# title. Keep kitty's integration from changing those visible bits, while
# retaining the invisible extras (prompt marks, cwd tracking):
#   no-cursor: cursor stays a block at the shell prompt (no beam)
#   no-title:  the title only changes if a program sets it via OSC escape,
#              matching alacritty's dynamic_title behavior
shell_integration no-cursor no-title
