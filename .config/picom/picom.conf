# ============================================================================
#  picom.conf - "industrial" profile for i3 on Gentoo (xrender backend)
#
#  Matches the existing design language: square 4px frames, flat panels and
#  the palette in ~/.config/i3/config, rofi and dunst
#      #121212  #333333  #666666  #008080
#  No shadows, snappy fades, 5px rounded corners, no glassy overshoot.
#
#  Runs on the *xrender* backend, not glx: this X server has no GL
#  acceleration at the moment, so glx would rasterise every frame through
#  llvmpipe on the CPU (measured ~780% CPU).  See the Backend section.
#
#  Validate:  picom --config ~/.config/picom/picom.conf --diagnostics
#  Log:       $XDG_RUNTIME_DIR/picom.log
# ============================================================================

#################################
#            Backend            #
#################################

# xrender, NOT glx.
#
# glx is required for dual_kawase blur, but this box's X server currently has
# no GL acceleration: xf86-video-nouveau cannot drive NV194 (RTX 4070 SUPER),
# X falls back to modesetting, and glamor refuses llvmpipe - so the glx backend
# rasterises the whole desktop in software (measured: ~780% CPU, unusable).
#
# xrender composites through the X server's own pixman path, which needs no GL,
# and costs the same order as xcompmgr (measured: ~1.2% CPU).  Rounded corners
# survive the switch: both backends implement corner-radius (xrender via a
# cached corner mask, glx via a fragment shader - not via X Shape), and every
# rule in this file is backend-independent.  Blur is off (see the Blur
# section), so nothing that needs glx is in use.
#
# If the GL driver is ever fixed (nvidia-drivers for the running kernel, or a
# nouveau/mesa that knows NV194): set backend = "glx" and vsync = true again.
backend = "xrender";

# vsync needs glx: the xrender path has no presentation/vblank feedback, so
# picom would warn and ignore it.  Without it, fast motion can tear.
vsync = false;

# NVIDIA's GL driver uses explicit sync; picom detects this on its own, this
# just makes it unambiguous.
xrender-sync-fence = true;

# Dithering adds noise - off, the teal 4px borders must stay crisp.
dithered-present = false;

# Honour _NET_WM_WINDOW_OPACITY set by clients (alacritty's own opacity etc.).
#
# MUST stay false for uniform transparency: with it true, any client that sets
# _NET_WM_WINDOW_OPACITY (alacritty with its own opacity, dunst with its default
# `transparency = 0`) overrides the uniform value below, so that window stops
# matching the rest of the desktop.
detect-client-opacity = false;

# Dialogs/transients follow their parent for focus, opacity and fading.
detect-transient = true;
detect-client-leader = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

# Repaint only damaged regions.
use-damage = true;

# Slightly rounded window corners, in pixels.
#
# Keep the polybar dock square while rounding regular i3 client windows.
corner-radius = 5;

rounded-corners-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'i3lock' || class_g = 'i3lock-color'",
  "_NET_WM_STATE@ *= '_NET_WM_STATE_FULLSCREEN'",
];

#################################
#            Shadows            #
#################################

# OFF: windows cast no shadow at all - the flat look wins over depth.
#
# Every option below the switch is kept as-is but has no effect while the
# switch is false, so turning shadows back on is a one-line change.  Nothing
# else in the desktop depends on them (fades, opacity and rounded corners are
# independent settings).
shadow = false;

# --- inactive while shadow = false -------------------------------------
shadow-radius = 14;
shadow-opacity = 0.78;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-color = "#000000";
# A window that is fully on one monitor should not bleed onto the next.
crop-shadow-to-monitor = true;
# The i3bar must not receive a shadow from the windows below it.
clip-shadow-above = true;

shadow-exclude = [
  "window_type = 'dock' || window_type = 'desktop'",
  "window_type = 'tooltip' || window_type = 'menu' || window_type = 'dropdown_menu'",
  "class_g = 'Dunst' || class_g = 'slop'",
  "class_g = 'firefox'",
  "class_g = 'i3lock' || class_g = 'i3lock-color'",
  "_NET_WM_STATE@ *= '_NET_WM_STATE_FULLSCREEN'",
  "_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN'",
  "override_redirect = true",
];

#################################
#             Fades             #
#################################

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.10;
fade-delta = 8;
# Windows appear instantly and fade only on opacity changes; keeps the
# workspace feeling like a panel, not a slideshow.
no-fading-openclose = true;

fade-exclude = [
  "window_type = 'dock' || window_type = 'desktop'",
  "_NET_WM_STATE@ *= '_NET_WM_STATE_FULLSCREEN'",
];

#################################
#        Transparency           #
#################################

# No transparency: the whole UI is opaque.
#
# picom composes the frame as frame-opacity * window-opacity, and at 1.0 the
# frame inherits the window opacity exactly, so frame-opacity stays 1.0 and the
# two lines below are the single dial for every surface: window content, the
# 4px border, the titlebar, the i3bar, the launcher and notifications.
#
# Keep active == inactive: any difference between them shows up as focused and
# unfocused windows having different transparency.
#
# 0.60 = clearly glass, 0.75 / 0.85 / 0.94 for a subtler look.  Going back to
# glass is NOT just these two lines: the notes further down list the
# opacity-rule entries that have to come back with it, and the clients that
# paint their own alpha (dunst - see ~/.config/dunst/dunstrc) and the lock
# screen (see ~/.local/bin/lock) have to be made translucent again too.
#
# A/B measured on this box on one window over a black backdrop (teal #008080,
# g=128 would be opaque):
#     frame-opacity 1.0  + window 0.94 -> titlebar g=120, border g=120  (0.94)
#     frame-opacity 0.60 + window 0.94 -> titlebar g=72,  border g=72   (0.56)
frame-opacity = 1.0;
active-opacity = 1.0;
inactive-opacity = 1.0;
inactive-dim = 0.0;
inactive-opacity-override = false;

focus-exclude = [
  "class_g = 'mpv'",
  # The locker is override-redirect and never gets focus, but it must not be
  # treated as an "inactive" window: a 95% lock screen would leak the desktop.
  "class_g = 'i3lock' || class_g = 'i3lock-color'",
  "_NET_WM_STATE@ *= '_NET_WM_STATE_FULLSCREEN'",
];

# NOTE: regex operators are not usable on class_g in picom 13
# ("Pattern \"class_g =~ 'x'\" pos 9: Invalid pattern type"), so match exactly.
#
# No opacity-rule at all: active/inactive-opacity are 1.0, so no surface needs
# an entry to be kept in step with them.
#
# Opacity rules only ever existed to patch the surfaces that do NOT inherit
# active/inactive-opacity once the UI went translucent.  If glass ever comes
# back, these are the entries to restore with the opacity reset to 0.60:
#   - the i3bar (dock): without it the bar stays opaque and breaks uniformity
#     (measured alpha 1.00 vs 0.61 with the rule).
#   - "class_g = 'Rofi'": the launcher, same class of window as the bar.
#   - "override_redirect = true": i3 draws the tab bar of a tabbed container,
#     plus menus/tooltips, in override-redirect windows, which picom skips for
#     active/inactive-opacity - they were the one surface left opaque while
#     everything else was glass.  frame-opacity is NOT the knob for them: it
#     dims the 4px border and leaves the tabs untouched.
#   - dunst notifications are NOT reachable from here at all - even an explicit
#     "60:class_g = 'Dunst'" left a notification at alpha 1.000.  Their
#     transparency has to be written into their own colour alpha
#     (see ~/.config/dunst/dunstrc), not into picom.
#   - keep "100:class_g = 'mpv'", "100:class_g = 'i3lock' || class_g =
#     'i3lock-color'" and "100:_NET_WM_STATE@ *= '_NET_WM_STATE_FULLSCREEN'"
#     (video, the locker - a translucent lock screen leaks the desktop - and
#     fullscreen windows) as the deliberate opaque exceptions.

#################################
#             Blur              #
#################################

# dual_kawase is the only affordable GLX blur method (kernel convolution is
# far too slow here).  It applies to translucent windows only, and every window
# is opaque now (see the Transparency section), so this is off - it would be
# pure GPU cost with nothing to show.  Turn it back on together with a
# non-1.0 active/inactive-opacity.
blur-background = false;
blur-method = "dual_kawase";
blur-strength = 5;
blur-background-fixed = true;
# Only meaningful together with blur-background above: with translucent frames
# the strip behind them has to be blurred too or the border looks pasted onto a
# sharp backdrop.
blur-background-frame = true;

blur-background-exclude = [
  # The dock is deliberately NOT excluded here: the i3bar is a window like any
  # other, so if it ever goes translucent again it wants the blur behind it.
  # Only the wallpaper itself is never blurred.
  "window_type = 'desktop'",
  "class_g = 'slop'",
  # Kept for when blur is switched back on: video is never blurred.
  "class_g = 'mpv'",
  # The locker fills the screen with a flat opaque colour (see ~/.local/bin/lock)
  # - it has no translucent surface left, so there is nothing to blur behind it.
  "class_g = 'i3lock' || class_g = 'i3lock-color'",
  "_NET_WM_STATE@ *= '_NET_WM_STATE_FULLSCREEN'",
];

# WARNING: do not add a `rules:` block.  Setting `rules` silently disables
# every old-style rule option above (shadow-exclude, fade-exclude,
# focus-exclude, opacity-rule, blur-background-exclude) - verified with
# `picom --config ... --diagnostics`, which reports
# "sanitize_options WARN ... the old-style rule options will have no effect".
